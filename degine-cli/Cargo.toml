[package]
name = "degine"
version = "0.1.1"
edition = "2021"
description = "Command line client for a degine argument library"
license = "MIT"
repository = "https://github.com/hiibolt/degine"
homepage = "https://degine.hiibolt.com"
readme = "README.md"
keywords = ["cli", "argument", "proof"]
categories = ["command-line-utilities"]

[[bin]]
name = "degine"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
ureq = "3.4"
