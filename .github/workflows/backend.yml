name: backend

on:
  push:
    branches: [main]
    paths:
      - "degine-backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: degine-backend
          push: true
          tags: |
            ghcr.io/hiibolt/degine-backend:latest
            ghcr.io/hiibolt/degine-backend:${{ github.sha }}
